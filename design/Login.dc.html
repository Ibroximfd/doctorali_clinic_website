<!doctype html>
<html>

<helmet>

  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #1f7c52; text-decoration: none; }
    a:hover { color: #2e9e6b; }
    .da { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
    .lbl { font-size: 12.5px; font-weight: 600; color: #566056; margin-bottom: 6px; display: block; }
    .fld { width: 100%; height: 50px; padding: 0 14px; border: 1px solid #e4e8e4; border-radius: 14px; background: #fff; display: flex; align-items: center; gap: 10px; font-size: 14px; }
  </style>

<div class="da" style="width: 1440px; height: 880px; background: #f5f7f6; color: #1b241f; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center">

  <div style="position: absolute; inset: 0; background: radial-gradient(120% 110% at 50% 15%, rgba(46,158,107,0.09) 0%, rgba(46,158,107,0) 62%)"></div>

  <div style="position: relative; width: 420px">

        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 9v6"/><path d="M9 12h6"/></svg>

      <div style="margin-bottom: 20px">
        <div style="font-size: 20px; font-weight: 600; line-height: 1.3">Tizimga kirish</div>
        <div style="font-size: 12.5px; color: #566056; margin-top: 4px">Login sifatida telefon raqami yoki uid</div>
      </div>

      <label class="lbl">Login</label>
      <div class="fld" style="margin-bottom: 16px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a938a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
        <span class="num" style="flex: 1 1 auto; font-weight: 600">998901234567</span>
      </div>

      <label class="lbl">Parol</label>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a938a" stroke-width="2" stroke-linecap="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span style="flex: 1 1 auto; letter-spacing: 3px; font-weight: 700; color: #566056">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span>

      <div style="display: flex; align-items: center; gap: 8px; margin: 14px 0 18px">
        <span style="width: 20px; height: 20px; border-radius: 6px; background: #2e9e6b; display: inline-flex; align-items: center; justify-content: center">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a938a" stroke-width="2" stroke-linecap="round" style="flex: 0 0 16px; margin-top: 1px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span style="font-size: 12.5px; color: #8a938a; line-height: 1.5">Faqat qabulxona hisoblari kira oladi. Parolni unutgan bo&rsquo;lsangiz administratorga murojaat qiling.</span>

</div>
