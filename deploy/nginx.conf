# ==============================================================================
# Doctor Ali — Qabulxona · nginx
#
# The panel runs `next start` (SSR shell + client-side data), so nginx is a
# reverse proxy, not a static file server. Two things it does that the Node
# process should not:
#
#   • serves /_next/static straight from the immutable cache — those filenames
#     are content-hashed, so a year is not optimistic;
#   • proxies /api to the backend on the same origin, which keeps the browser
#     out of CORS entirely and lets the panel be served over HTTPS while the
#     API sits behind it.
#
# Copy to /etc/nginx/conf.d/qabulxona.conf and replace the two hostnames.
# ==============================================================================

upstream qabulxona_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Resized product photos and avatars, cached at the edge. The originals are
# multi-megabyte uploads that Next shrinks on first request; keeping the result
# here means that first request is paid once per server — not once per Node
# restart, and not at all while the app is redeploying.
proxy_cache_path /var/cache/nginx/qabulxona_images levels=1:2
                 keys_zone=qabulxona_images:10m max_size=2g inactive=30d
                 use_temp_path=off;

upstream qabulxona_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name qabulxona.imorganic.uz;

    # Everything else is HTTPS; certbot writes its challenge here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name qabulxona.imorganic.uz;

    ssl_certificate     /etc/letsencrypt/live/qabulxona.imorganic.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qabulxona.imorganic.uz/privkey.pem;

    # A receipt payload or a client import is well under this; a stray upload
    # should fail at the edge rather than halfway through the app.
    client_max_body_size 20m;

    # The panel holds client records — no crawler, no framing, no sniffing.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Immutable build output ------------------------------------------------
    # Content-hashed filenames: a new build produces new names, so nothing here
    # is ever revalidated.
    location /_next/static/ {
        proxy_pass http://qabulxona_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimised images are addressed by their query string, which already
    # carries the source URL and the width.
    location /_next/image {
        proxy_pass http://qabulxona_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache            qabulxona_images;
        proxy_cache_key        $uri$is_args$args;
        proxy_cache_valid      200 30d;
        # A stale thumbnail beats a broken one while the app restarts.
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        proxy_cache_lock       on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* ^/(favicon\.png|manifest\.webmanifest|icons/) {
        proxy_pass http://qabulxona_app;
        add_header Cache-Control "public, max-age=86400";
    }

    # --- Reception API ---------------------------------------------------------
    # Same origin as the panel, so the browser never makes a cross-origin
    # request and the backend never needs a CORS policy for this host.
    location /api/ {
        proxy_pass http://qabulxona_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # An Excel export of a year of orders takes its time.
        proxy_read_timeout 120s;

        # Money must never be answered from a cache.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # --- The app ---------------------------------------------------------------
    location / {
        proxy_pass http://qabulxona_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # HTML is per-session: it carries the auth redirect decision.
        add_header Cache-Control "no-store" always;
    }
}
