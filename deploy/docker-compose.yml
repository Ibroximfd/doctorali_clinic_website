# Runs the panel next to nginx on the clinic's own server.
#
# The API is NOT in here on purpose: it already runs (and is backed up) as its
# own deployment, and this compose file must never become the thing that
# restarts the backend.
services:
  qabulxona:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Inlined at build time — see the Dockerfile's note.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/reception/}
        NEXT_PUBLIC_MEDIA_ORIGIN: ${NEXT_PUBLIC_MEDIA_ORIGIN:-https://my.imorganic.uz}
        NEXT_PUBLIC_PRINT_AGENT_URL: ${NEXT_PUBLIC_PRINT_AGENT_URL:-http://localhost:9110}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://qabulxona.imorganic.uz}
    image: doctor-ali-qabulxona:latest
    container_name: qabulxona
    restart: unless-stopped
    environment:
      # Read at runtime: switching backend is a restart, not a rebuild.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-https://my.imorganic.uz}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Resized product photos and avatars. Without this the cache lives inside
      # the container and a redeploy throws it away, so the first hour after
      # every release is spent re-shrinking multi-megabyte originals.
      - image-cache:/app/.next/cache/images

volumes:
  image-cache:
