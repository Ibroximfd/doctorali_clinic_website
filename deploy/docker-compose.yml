# Panelni klinikaning o'z serverida nginx yonida yuritadi.
#
# Domen, port va backend manzili bu yerda emas — `config/servers.mjs` da.
# `deploy/deploy.sh` o'sha fayldan o'qib, quyidagi o'zgaruvchilarni eksport
# qilib beradi, shuning uchun bitta compose fayl test'ni ham, prod'ni ham
# xizmat qiladi:
#
#   ./deploy/deploy.sh prod
#
# Backend ATAYLAB bu yerda yo'q: u o'zining alohida deploy'i sifatida ishlaydi va
# bu fayl hech qachon backendni qayta ishga tushiradigan narsaga aylanmasligi kerak.
services:
  qabulxona:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Build paytida `next.config.ts` shu nom bo'yicha serverni tanlaydi va
        # NEXT_PUBLIC_* qiymatlarini bundle ichiga yozadi.
        APP_SERVER: ${APP_SERVER:?deploy.sh orqali ishga tushiring}
        NEXT_PUBLIC_PRINT_AGENT_URL: ${NEXT_PUBLIC_PRINT_AGENT_URL:-http://localhost:9110}
        NEXT_PUBLIC_API_LOGGING: ${NEXT_PUBLIC_API_LOGGING:-false}
    # Har bir muhitning o'z image tegi: prod'ni deploy qilish test image'ini
    # bosib ketmaydi va orqaga qaytarish uchun eskisi joyida qoladi.
    image: doctor-ali-qabulxona:${APP_SERVER}
    container_name: ${CONTAINER_NAME:-qabulxona}
    restart: unless-stopped
    environment:
      # Runtime'da o'qiladi: nginx'siz holatda panelning o'zi API'ni shu serverga
      # uzatadi.
      APP_SERVER: ${APP_SERVER}
      # Backendni vaqtincha boshqa manzilga qaratish — qayta build emas, restart.
      # Bo'sh bo'lsa APP_SERVER dagi serverning o'zi ishlatiladi.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-}
    extra_hosts:
      # Backend shu serverda, konteynerdan tashqarida ishlayapti. Linux'da
      # `host.docker.internal` o'zi yo'q — host-gateway uni hostning IP'siga
      # bog'laydi.
      - "host.docker.internal:host-gateway"
    ports:
      # Faqat loopback: tashqi dunyo panelga faqat nginx orqali kiradi.
      - "127.0.0.1:${APP_PORT:?deploy.sh orqali ishga tushiring}:3000"
    volumes:
      # Kichraytirilgan mahsulot rasmlari va avatarlar. Busiz kesh konteyner
      # ichida yashaydi va har deploy uni tashlab yuboradi — natijada har
      # relizdan keyingi birinchi soat ko'p megabaytli originallarni qaytadan
      # siqishga ketadi.
      - image-cache:/app/.next/cache/images

volumes:
  image-cache:
